deploy:
  stage: deploy
  only:
    - master

  image: klakegg/hugo:ext-alpine-ci
  script: 
    - apk add lftp
    - apk add git
    - echo "-.-.-.-.-.-.-.-.-.-.-.-."
    - git submodule init
    - git submodule update --remote --merge
    - echo "-.-.-.-.-.-.-.-.-.-.-.-."
    - hugo
    - lftp -e "set sftp:auto-confirm yes; mirror -c -R -X .* --verbose ./public sftp://my_webapp__2:$Deploy_PW@my-srvr.de:22000/www;"